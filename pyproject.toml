[project]
name = "llenvs"
version = "0.1.0"
description = "MDP-style access to evaluation environments for LLM agentic behavior research"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sergio Hernandez-Gutierrez" }]
keywords = ["llm", "evaluation", "mdp", "reinforcement-learning", "reasoning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
reasoning-gym = ["reasoning-gym>=0.1"]
huggingface = ["datasets>=2.14", "huggingface-hub>=0.20"]
gem = ["gem-llm>=0.1.0"]
vllm = ["vllm>=0.4"]
transformers = ["transformers>=4.36", "torch>=2.0", "accelerate>=0.25"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
agentgym = ["agentenv>=0.0.1"]
verifiers = ["verifiers>=0.1"]
openenv = ["openenv-core>=0.1"]
gymnasium = ["gymnasium>=0.26"]
alfworld = ["alfworld>=0.3"]
jericho = ["jericho>=3.0"]
aviary = ["fhaviary>=0.30"]
# lmrl: Install separately with pip install git+https://github.com/abdulhaim/LMRL-Gym.git
# Not included as a formal optional dep due to pinned legacy dependencies in LMRL-Gym.
math-verify = ["math-verify[antlr4-13-2]>=0.7"]
wandb = ["wandb>=0.16"]
rl = ["datasets>=2.14"]
trl = ["trl>=0.7", "datasets>=2.14"]
all = [
  "llenvs[reasoning-gym,huggingface,gem,agentgym,verifiers,openenv,gymnasium,alfworld,jericho,aviary,vllm,openai,anthropic,transformers,math-verify,rl,wandb]",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ty>=0.0.1",
  "ruff>=0.1",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.scripts]
llenvs = "llenvs.cli.run:main"

[project.urls]
Homepage = "https://github.com/serhez/llenvs"
Documentation = "https://github.com/serhez/llenvs#readme"
Repository = "https://github.com/serhez/llenvs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llenvs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
