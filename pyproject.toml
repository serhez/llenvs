[project]
name = "llenvs"
version = "0.1.0"
description = "MDP-style access to evaluation environments for LLM agentic behavior research"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "llenvs contributors" }
]
keywords = [
    "llm",
    "evaluation",
    "mdp",
    "reinforcement-learning",
    "reasoning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
reasoning-gym = [
    "reasoning-gym>=0.1",
]
huggingface = [
    "datasets>=2.14",
    "huggingface-hub>=0.20",
]
gem = [
    "gem-llm>=0.1.0",
]
vllm = [
    "vllm>=0.4",
]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.20",
]
all = [
    "llenvs[reasoning-gym,huggingface,gem,vllm,openai,anthropic]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.scripts]
llenvs = "llenvs.cli.run:main"

[project.urls]
Homepage = "https://github.com/example/llenvs"
Documentation = "https://github.com/example/llenvs#readme"
Repository = "https://github.com/example/llenvs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llenvs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
