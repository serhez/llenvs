site_name: llenvs
site_description: MDP-style access to evaluation environments for LLM research

theme:
  name: material
  icon:
    logo: material/flask-outline
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

nav:
  - Home: README.md
  - Getting Started:
    - Installation: getting-started/install.md
    - Quick Start: getting-started/quickstart.md
  - Guides:
    - Environments: guides/environments.md
    - Prompts: guides/prompts.md
    - Tools: guides/tools.md
    - Segmentation: guides/segmentation.md
    - Evaluation: guides/evaluation.md
    - Backends: guides/backends.md
    - Parallelization: guides/parallelization.md
  - Adapters:
    - ReasoningGym: adapters/reasoning-gym.md
    - HuggingFace: adapters/huggingface.md
    - GEM: adapters/gem.md
    - WebShop: adapters/webshop.md
  - Reference:
    - Configuration: reference/config.md
    - Core Abstractions: reference/core.md
    - Tools: reference/tools.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
